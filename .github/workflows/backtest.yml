name: MiroFish Backtest Engine

on:
  workflow_dispatch: # 允许你在网页端手动点击按钮运行

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy

    - name: Run Backtest Script
      run: python scripts/backtest.py

    - name: Upload Backtest Report
      uses: actions/upload-artifact@v3
      with:
        name: mirofish-backtest-results
        path: output/backtest_report.csv
