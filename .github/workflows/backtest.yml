name: MiroFish Backtest Engine

on:
  workflow_dispatch: 

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # 升级到了 v4

    - name: Set up Python
      uses: actions/setup-python@v5 # 升级到了 v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy

    - name: Run Backtest Script
      run: python scripts/backtest.py

    - name: Upload Backtest Report
      uses: actions/upload-artifact@v4  # 这里修复了报错，升级到了 v4
      with:
        name: mirofish-backtest-results
        path: output/backtest_report.csv
